    @keyframes pbGlow { 0%,100% { box-shadow: 0 0 20px rgba(255,200,80,0.15); } 50% { box-shadow: 0 0 40px rgba(255,200,80,0.3); } }
    .fade-in { animation: fadeIn 0.3s ease-out; }

      { phrase: "ab ", group: "core" },
      { phrase: "core", group: "core" },
    ];
    const CARDIO_LIST = ["run", "bike", "swim", "cycle", "jog", "sprint", "elliptical", "stair", "walk", "treadmill", "rowing machine", "hiit"];

    function detectMuscle(name) {
      const l = normaliseName(name);
      for (const rule of MUSCLE_RULES) { if (l.includes(rule.phrase)) return rule.group; }
      if (CARDIO_LIST.some(k => l.includes(k))) return "cardio";
      return "other";
    }
    function isCardio(name) { const l = normaliseName(name); return CARDIO_LIST.some(k => l.includes(k)); }

    // --- Name normalisation: DB=Dumbbell, BB=Barbell, etc ---
    const NAME_ALIASES = [
      [/\bdb\b/gi, "dumbbell"], [/\bbb\b/gi, "barbell"], [/\bsm\b/gi, "smith machine"],
      [/\boh\b/gi, "overhead"], [/\brdl\b/gi, "romanian deadlift"], [/\bsldl\b/gi, "stiff leg deadlift"],
      [/\bincl\b/gi, "incline"], [/\bdecl\b/gi, "decline"], [/\bham curl\b/gi, "hamstring curl"],
    ];
    function normaliseName(name) {
      let n = name.toLowerCase().trim();
      NAME_ALIASES.forEach(([rx, rep]) => { n = n.replace(rx, rep); });
      return n;
    }
    // Canonical key for PB lookups — aggressive dedup
    // "Flat DB Bench", "Flat Dumbbell Bench Press", "Flat Dumbbell Bench" → same key
    const PB_STRIP_WORDS = ["machine", "press", "raise", "exercise", "cable", "seated", "standing", "lying", "single-leg", "single leg", "tempo", "long stride", "short stride"];
    const PB_SYNONYMS = [
      [/\bdumbbell\b/g, "db"], [/\bbarbell\b/g, "bb"], [/\bsmith machine\b/g, "smith"],
      [/\bhamstring\b/g, "ham"], [/\blateral\b/g, "lat"],
      [/\bcalf raises?\b/g, "calf"], [/\bbench press\b/g, "bench"],
      [/\bshoulder press\b/g, "shoulder"], [/\boverhead press\b/g, "ohp"],
      [/\bchest fly\b/g, "fly"], [/\bchest flye\b/g, "fly"],
      [/\bpull ?down\b/g, "pulldown"], [/\bpull ?up\b/g, "pullup"],
      [/\bchin ?up\b/g, "chinup"],
      [/\bbicep curl\b/g, "curl"], [/\bbiceps curl\b/g, "curl"],
      [/\b(ez[- ]?bar|ez)\b/g, "ez"],
    ];
    // Order-independent match key. "DB Chest Press" and "Chest DB Press" collapse
    // to the same value, so near-duplicates can be caught before they're created.
    const MATCH_FILLER = ["machine", "exercise", "the", "a", "with", "using", "both", "each", "reps", "rep", "set", "sets", "x"];
    function matchKey(name) {
      let n = pbKey(name);
      n = n.replace(/[^a-z0-9\s]/g, " ");              // hyphens/punctuation -> space
      n = n.replace(/\b\d+\s*x\s*\d+\b/g, " ");        // strip "3 x 8" style suffixes
      n = n.replace(/\b\d+\b/g, " ");                   // strip bare numbers
      const toks = n.split(/\s+/)
        .map(t => t.length > 3 && t.endsWith("s") && !t.endsWith("ss") ? t.slice(0, -1) : t) // rows -> row
        .filter(t => t && !MATCH_FILLER.includes(t));
      return [...new Set(toks)].sort().join(" ");       // dedupe + sort = order independent
    }
    // Existing library entries that look like the same movement as `name`.
    // Exact matchKey hits first, then high-overlap partials.
    function findSimilar(name, library, limit = 4) {
      const raw = (name || "").trim();
      if (raw.length < 3) return [];
      const k = matchKey(raw);
      if (!k) return [];
      const kt = new Set(k.split(" "));
      const out = [];
      Object.values(library || {}).forEach(entry => {
        if (!entry?.name) return;
        if (entry.name.trim().toLowerCase() === raw.toLowerCase()) return; // already identical
        const ek = matchKey(entry.name);
        if (!ek) return;
        if (ek === k) { out.push({ ...entry, score: 1 }); return; }
        const et = new Set(ek.split(" "));
        let shared = 0; kt.forEach(t => { if (et.has(t)) shared++; });
        const score = shared / Math.max(kt.size, et.size);
        if (score >= 0.6) out.push({ ...entry, score });
      });
      return out.sort((a, b) => b.score - a.score || (b.frequency || 0) - (a.frequency || 0)).slice(0, limit);
    }

    // Plan a name merge across history, blueprints and PBs.
    // EXACT matchKey only — no fuzzy matching, so merged names are genuinely the same movement.
    // Identical except for case, punctuation, spacing or word order — no words differ.
    function strictKey(name) {
      const toks = (name || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").split(/\s+/).filter(Boolean);
      return [...new Set(toks)].sort().join(" ");
    }

    function planNameMerge(db) {
      const groups = {}; // matchKey -> { names: {name: count}, lastUsed }
      const note = (name, count, date) => {
        if (!name) return;
        const k = matchKey(name);
        if (!k) return;
        if (!groups[k]) groups[k] = { names: {}, lastUsed: null };
        groups[k].names[name] = (groups[k].names[name] || 0) + count;
        if (date && (!groups[k].lastUsed || new Date(date) > new Date(groups[k].lastUsed))) groups[k].lastUsed = date;
      };
      (db.history || []).forEach(s => (s.exercises || []).forEach(ex => note(ex.name, 1, s.date)));
      Object.values(db.blueprints || {}).forEach(bp => (bp.exercises || []).forEach(ex => note(ex.name, 0, null)));
      Object.values(db.pbs || {}).forEach(pb => note(pb._displayName, 0, null));

      const plan = [];
      Object.values(groups).forEach(g => {
        const variants = Object.keys(g.names);
        if (variants.length < 2) return; // nothing to merge
        // Canonical = most-used, tie-break on longest (more descriptive)
        const paren = s => (/\([^)]*\)/.test(s) ? 1 : 0);
        const canonical = variants.slice().sort((a, b) =>
          (paren(a) - paren(b)) ||               // plain names beat qualified ones
          (g.names[b] - g.names[a]) ||           // then most used
          (a.trim().length - b.trim().length) || // then shortest
          a.localeCompare(b))[0].trim();
        const sk = strictKey(canonical);
        const safe = variants.every(v => strictKey(v) === sk);
        plan.push({
          canonical,
          safe,
          variants: variants.filter(v => v.trim() !== canonical)
            .map(v => ({ name: v, count: g.names[v], safe: strictKey(v) === sk }))
            .sort((a, b) => (b.safe - a.safe) || (b.count - a.count)),
          totalSessions: variants.reduce((t, v) => t + g.names[v], 0),
        });
      });
      return plan.sort((a, b) => (b.safe - a.safe) || (b.totalSessions - a.totalSessions));
    }

    // Apply a plan: rewrite names in history + blueprints, then re-dedupe PBs.
    function applyNameMerge(db, plan) {
      const map = {}; // oldName -> canonical (only variants explicitly included)
      plan.forEach(p => p.variants.forEach(v => { if (v.include) map[v.name] = p.canonical; }));
      const next = deepClone(db);
      let renamed = 0;
      (next.history || []).forEach(s => (s.exercises || []).forEach(ex => {
        if (map[ex.name]) { ex.name = map[ex.name]; renamed++; }
      }));
      Object.values(next.blueprints || {}).forEach(bp => (bp.exercises || []).forEach(ex => {
        if (map[ex.name]) ex.name = map[ex.name];
      }));
      next.pbs = deduplicatePBs(next.pbs || {});
      if (next.activeGym) {
        next.pbsByGym = { ...(next.pbsByGym || {}), [next.activeGym]: next.pbs };
      }
      return { db: next, renamed };
    }

    const RATINGS = [
      { v: 1, label: "Poor",   color: "#ff5252" },
      { v: 2, label: "Flat",   color: "#ff9800" },
      { v: 3, label: "Solid",  color: "#ffc107" },
      { v: 4, label: "Strong", color: "#00e676" },
      { v: 5, label: "Peak",   color: "#00e5ff" },
    ];
    const NOTE_MAX = 30;
    function ratingInfo(v) { return RATINGS.find(r => r.v === v) || null; }

    function gymCode(g) { return g === "Saint Haven" ? "SH" : g === "Mt Martha" ? "MM" : g === "Other" ? "OT" : (g || "SH").slice(0, 2).toUpperCase(); }

    function pbKey(name) {
      let n = normaliseName(name);
      // Apply synonym compression
      PB_SYNONYMS.forEach(([rx, rep]) => { n = n.replace(rx, rep); });
      // Remove parenthetical qualifiers like "(Cable)" "(Seated)"
      n = n.replace(/\([^)]*\)/g, "");
      // Remove trailing filler words that don't change the exercise identity
      // BUT keep important differentiators like "incline", "decline", "flat", "wide-grip", "close-grip", "neutral-grip"
      // Collapse multiple spaces
      n = n.replace(/\s+/g, " ").trim();
      return n;
    }
    // Merge duplicate PBs: scans db.pbs for entries with same pbKey, keeps the best
    function deduplicatePBs(pbs) {
      const merged = {};
      const keyMap = {}; // pbKey → best display name
      Object.entries(pbs).forEach(([rawName, pb]) => {
        const k = pbKey(rawName);
        if (!merged[k]) {
          merged[k] = { ...pb };
          keyMap[k] = rawName;
        } else {
          if (pb.maxWeight > merged[k].maxWeight) { merged[k].maxWeight = pb.maxWeight; merged[k].repsAtMax = pb.repsAtMax || 0; }
          else if (pb.maxWeight === merged[k].maxWeight && (pb.repsAtMax || 0) > (merged[k].repsAtMax || 0)) { merged[k].repsAtMax = pb.repsAtMax; }
          if (pb.maxReps > merged[k].maxReps) merged[k].maxReps = pb.maxReps;
          if ((pb.maxVolume || 0) > (merged[k].maxVolume || 0)) merged[k].maxVolume = pb.maxVolume;
          if (rawName.length > keyMap[k].length) keyMap[k] = rawName;
        }
      });
      // Rebuild with canonical keys
      const result = {};
      Object.entries(merged).forEach(([k, pb]) => { result[k] = pb; result[k]._displayName = keyMap[k]; });
      return result;
    }

    // --- Week boundary: Monday 00:00 AEST (UTC+10) ---
    function getMonday(date) {
      const d = new Date(date);
      // Adjust to AEST (UTC+10)
      const aest = new Date(d.getTime() + (10 * 60 * 60 * 1000));
      const day = aest.getUTCDay(); // 0=Sun, 1=Mon
      const diff = day === 0 ? 6 : day - 1; // days since Monday
      aest.setUTCDate(aest.getUTCDate() - diff);
      aest.setUTCHours(0, 0, 0, 0);
      // Convert back to UTC
      return new Date(aest.getTime() - (10 * 60 * 60 * 1000));
    }
    function thisMonday() { return getMonday(new Date()); }
    function thisMonthStart() {
      const d = new Date();
      const aest = new Date(d.getTime() + (10 * 60 * 60 * 1000));
      return new Date(Date.UTC(aest.getUTCFullYear(), aest.getUTCMonth(), 1) - (10 * 60 * 60 * 1000));
    }

    function deepClone(o) { try { return JSON.parse(JSON.stringify(o, (_, v) => typeof v === "number" && isNaN(v) ? null : v)); } catch (e) { console.error("deepClone failed:", e); return o; } }
    function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
    function fmtTime(s) { if (s < 0) s = 0; return `${Math.floor(s / 60)}:${Math.floor(s % 60).toString().padStart(2, "0")}`; }
    function fmtDur(s) { const hr = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = Math.floor(s % 60); return hr > 0 ? `${hr}h ${m}m` : m > 0 ? `${m}m ${sec}s` : `${sec}s`; }

    const C = {
      bg: "#0a0a0f", surface: "#12121a", surfaceLight: "#1a1a28", border: "#2a2a3a",
      text: "#e8e8f0", textDim: "#8888a0",
      cyan: "#00e5ff", cyanDim: "#00e5ff40", green: "#39ff14", greenDim: "#39ff1440",
      amber: "#ffb300", amberDim: "#ffb30040", red: "#ff3d3d", redDim: "#ff3d3d40", purple: "#b388ff", purpleDim: "#b388ff40",
      gold: "#ffc850", goldDim: "#ffc85040",
    };
    const phaseColor = { [PHASES.PREP]: C.amber, [PHASES.WORK]: C.cyan, [PHASES.REST_SET]: C.green, [PHASES.REST_EX]: C.purple, [PHASES.DONE]: C.green };

    // --- Storage ---
    const SEED_PBS = {
      "standing calf raise": { maxWeight: 136, maxReps: 10, maxVolume: 2460, repsAtMax: 10 },
      "flat dumbbell bench press": { maxWeight: 70, maxReps: 9, maxVolume: 1890, repsAtMax: 9 },
      "incline dumbbell bench press": { maxWeight: 60, maxReps: 10, maxVolume: 1860, repsAtMax: 10 },
      "leg curl": { maxWeight: 45, maxReps: 10, maxVolume: 1620, repsAtMax: 10 },
      "seated dumbbell shoulder press": { maxWeight: 44, maxReps: 10, maxVolume: 1500, repsAtMax: 10 },
      "chest-supported row": { maxWeight: 40, maxReps: 10, maxVolume: 1600, repsAtMax: 10 },
      "smith machine split squat": { maxWeight: 40, maxReps: 10, maxVolume: 1360, repsAtMax: 10 },
      "split squat": { maxWeight: 40, maxReps: 10, maxVolume: 1040, repsAtMax: 10 },
      "cable chest fly": { maxWeight: 27, maxReps: 10, maxVolume: 905, repsAtMax: 10 },

    function fmtClock(d) { return new Date(d).toLocaleTimeString("en-AU", { hour: "numeric", minute: "2-digit" }).toLowerCase().replace(/\s/g, ""); }
    // Start/end for a session. Uses explicit fields when present, otherwise derives
    // from date (the save moment) minus duration — works for all legacy sessions.
    function sessionTimes(x) {
      const end = x.endTime ? new Date(x.endTime) : new Date(x.date);
      const start = x.startTime ? new Date(x.startTime) : new Date(end.getTime() - (x.duration || 0) * 1000);
      return { start, end };
    }

    function mkBPEx(name) { return { name, muscle: detectMuscle(name), isCardio: isCardio(name) }; }
    const SEED_BLUEPRINTS = {
      Monday: { name: "Workout A – Upper Emphasis", exercises: [

    function loadDB() {
      try {
        const d = localStorage.getItem(STORAGE_KEY);
        if (d) {
          const parsed = JSON.parse(d);
          let changed = false;
          if (!parsed._pbSeeded) { parsed.pbs = { ...SEED_PBS, ...(parsed.pbs || {}) }; parsed._pbSeeded = true; changed = true; }
          if (!parsed._bpSeeded) { parsed.blueprints = { ...SEED_BLUEPRINTS, ...(parsed.blueprints || {}) }; parsed._bpSeeded = true; changed = true; }
          // Deduplicate PBs on load
          const dedupedPBs = deduplicatePBs(parsed.pbs || {});
          if (Object.keys(dedupedPBs).length !== Object.keys(parsed.pbs || {}).length) { parsed.pbs = dedupedPBs; changed = true; }
          // Backfill repsAtMax from history for PBs that don't have it
          Object.entries(parsed.pbs || {}).forEach(([k, pb]) => {
            if (pb.repsAtMax != null && pb.repsAtMax > 0) return; // already has it
            let bestRepsAtMax = 0;
            (parsed.history || []).forEach(session => {
              (session.exercises || []).forEach(ex => {
                if (pbKey(ex.name) !== k) return;
                (ex.sets || []).forEach(s => {
                  if (s.weight === pb.maxWeight && (s.reps || 0) > bestRepsAtMax) bestRepsAtMax = s.reps;
                });
              });
            });
            if (bestRepsAtMax > 0) { parsed.pbs[k].repsAtMax = bestRepsAtMax; changed = true; }
          });
          // Multi-gym migration: existing PBs belong to the default gym
          if (!parsed.gyms) { parsed.gyms = ["Saint Haven", "Mt Martha", "Other"]; changed = true; }
          if (!parsed.activeGym) { parsed.activeGym = "Saint Haven"; changed = true; }
          if (!parsed.pbsByGym) { parsed.pbsByGym = { [parsed.activeGym]: parsed.pbs || {} }; changed = true; }
          // Invariant: db.pbs always mirrors the active gym's PB map
          parsed.pbs = parsed.pbsByGym[parsed.activeGym] || {};
          // One-time manual injection: 26 May session that failed to save (from DONE screen)
          if (!(parsed.history || []).some(s => s.id === "manual-rescue-20260526")) {
            const mk = (w) => ({ weight: w, reps: 0, duration: 0, completed: true });
            const bw = () => ({ weight: 0, reps: 0, duration: 0, completed: true });
            parsed.history = parsed.history || [];
            parsed.history.push({
              id: "manual-rescue-20260526",
              date: new Date().toISOString(),
              duration: 2006, // 33m 26s
              gym: "Saint Haven",
              exercises: [
                { name: "Single leg calf raise (Smith machine)", muscle: "calves", isCardio: false, sets: [mk(40), mk(40), mk(40), mk(40)] },
                { name: "SL pogo", muscle: "other", isCardio: false, sets: [bw(), bw(), bw(), bw()] },
                { name: "Cable hip adduction", muscle: "other", isCardio: false, sets: [mk(10), mk(10), mk(10), mk(10)] },
                { name: "Seated calf raise", muscle: "calves", isCardio: false, sets: [mk(40), mk(40), mk(40), mk(45)] },
                { name: "Single leg leg press acceleration", muscle: "quads", isCardio: false, sets: [{ weight: 40, reps: 16, duration: 0, completed: true }, mk(40), mk(40), mk(40)] },
                { name: "Split stance pogos", muscle: "other", isCardio: false, sets: [bw(), bw(), bw(), bw()] },
                { name: "Skater jumps", muscle: "other", isCardio: false, sets: [bw(), bw(), bw(), bw()] },
              ],
            });
            // Record the PB it detected
            const pk = pbKey("Single leg leg press acceleration");
            if (!parsed.pbs[pk] || 40 > (parsed.pbs[pk].maxWeight || 0)) {
              parsed.pbs[pk] = { maxWeight: 40, maxReps: 16, repsAtMax: 16, maxVolume: 640, _displayName: "Single leg leg press acceleration" };
              parsed.pbsByGym[parsed.activeGym] = parsed.pbs;
            }
            changed = true;
          }
          // One-time: re-tag existing "other" exercises that are actually plyometric
          if (!parsed._plyoMigrated) {
            (parsed.history || []).forEach(s => (s.exercises || []).forEach(ex => {
              if ((ex.muscle === "other" || !ex.muscle) && detectMuscle(ex.name) === "plyometric") ex.muscle = "plyometric";
            }));
            Object.values(parsed.blueprints || {}).forEach(bp => (bp.exercises || []).forEach(ex => {
              if ((ex.muscle === "other" || !ex.muscle) && detectMuscle(ex.name) === "plyometric") ex.muscle = "plyometric";
            }));
            parsed._plyoMigrated = true; changed = true;
          }
          // One-time: re-tag Pallof (was caught by the "press"->chest rule) and
          // hip adduction (had no rule at all). Narrow — only these name patterns.
          if (!parsed._pallofAdductMigrated) {
            const retag = ex => {
              const l = (ex.name || "").toLowerCase();
              if (/pallof|anti[- ]?rotation/.test(l)) ex.muscle = "core";
              else if (/adduction|adductor/.test(l)) ex.muscle = "glutes";
            };
            (parsed.history || []).forEach(s => (s.exercises || []).forEach(retag));
            Object.values(parsed.blueprints || {}).forEach(bp => (bp.exercises || []).forEach(retag));
            parsed._pallofAdductMigrated = true; changed = true;
          }
          if (changed) saveDB(parsed);
          return parsed;
        }
      } catch {}
      // Legacy scan
      try {
        const keys = ["ironfocus_data", "ironfocus_history", "ironfocus_blueprints", "ironfocus_v2_master"];
        let merged = emptyDB();
        for (const k of keys) {
          try { const r = localStorage.getItem(k); if (r) { const d = JSON.parse(r); if (d.history) merged.history.push(...d.history); if (d.blueprints) Object.assign(merged.blueprints, d.blueprints); if (d.pbs) Object.assign(merged.pbs, d.pbs); } } catch {}
        }
        if (merged.history.length > 0 || Object.keys(merged.blueprints).length > 0) return merged;
      } catch {}
      const fresh = emptyDB();
      fresh.pbs = { ...SEED_PBS };
      fresh.blueprints = { ...SEED_BLUEPRINTS };
      fresh._pbSeeded = true;
      fresh._bpSeeded = true;
      return fresh;
    }
    function saveDB(db) {
      try {
        const clone = deepClone(db);
        if (!clone || !clone.history) { console.error("saveDB aborted: invalid data"); return false; }
        localStorage.setItem(STORAGE_KEY, JSON.stringify(clone));
        return true;
      } catch (e) { console.error("Save failed:", e); return false; }
    }
    function emptyDB() { return { history: [], blueprints: {}, pbs: {}, settings: { timers: { ...DEFAULT_TIMERS }, audioEnabled: true, volumeTargets: { ...DEFAULT_VOLUME_TARGETS }, trainingDays: ["Monday", "Tuesday", "Thursday", "Friday"] } }; }

    const DEFAULT_VOLUME_TARGETS = { chest: 16, back: 16, shoulders: 12, quads: 12, hamstrings: 10, glutes: 10, calves: 8, biceps: 8, triceps: 8, core: 8 };

    // Build exercise library from history + blueprints
    function buildExerciseLibrary(db) {
      const lib = {}; // pbKey → { name, muscle, isCardio, lastUsed, frequency }
      // Scan history
      (db.history || []).forEach(session => {
        const d = session.date;
        (session.exercises || []).forEach(ex => {
          const k = pbKey(ex.name);
          if (!lib[k]) lib[k] = { name: ex.name, muscle: ex.muscle || detectMuscle(ex.name), isCardio: isCardio(ex.name), lastUsed: d, frequency: 0 };
          lib[k].frequency++;
          if (new Date(d) > new Date(lib[k].lastUsed)) { lib[k].lastUsed = d; lib[k].name = ex.name; }
          if (ex.muscle && ex.muscle !== "other") lib[k].muscle = ex.muscle;
        });
      });
      // Scan blueprints
      Object.values(db.blueprints || {}).forEach(bp => {
        (bp.exercises || []).forEach(ex => {
          const k = pbKey(ex.name);
          if (!lib[k]) lib[k] = { name: ex.name, muscle: ex.muscle || detectMuscle(ex.name), isCardio: isCardio(ex.name), lastUsed: null, frequency: 0 };
          if (ex.muscle && ex.muscle !== "other") lib[k].muscle = ex.muscle;
        });
      });
      return lib;
    }

    }

    class AudioEngine {
      constructor() { this.ctx = null; this.enabled = true; this.hb = null; }
      init() { setAmbientAudio(); if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx.state === "suspended") this.ctx.resume(); this.loadVoice(); }
      loadVoice() {
        if (this.clips || !this.ctx) return; this.clips = {};
        Object.keys(VOICE_CLIPS).forEach(k => {
          try { const bin = atob(VOICE_CLIPS[k]); const buf = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
            this.ctx.decodeAudioData(buf.buffer, b => { this.clips[k] = b; }, () => {}); } catch {}
        });
      }
      say(key, alt) {
        if (!this.enabled) return; this.init();
        const b = (this.clips && (this.clips[key] || (alt && this.clips[alt])));
        if (!b) { this.phasePip(); return; }
        try { if (this.voiceSrc) this.voiceSrc.stop(); } catch {}
        const src = this.ctx.createBufferSource(), g = this.ctx.createGain(); g.gain.value = 1; src.buffer = b; src.connect(g); g.connect(this.ctx.destination); src.start(); this.voiceSrc = src;
      }
      pip(f = 880, d = 0.08) { if (!this.enabled || !this.ctx) return; const o = this.ctx.createOscillator(), g = this.ctx.createGain(); o.connect(g); g.connect(this.ctx.destination); o.frequency.value = f; o.type = "sine"; g.gain.setValueAtTime(0.3, this.ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + d); o.start(this.ctx.currentTime); o.stop(this.ctx.currentTime + d); }
      countdownPip() { this.pip(1200, 0.06); }
      phasePip() { this.pip(660, 0.15); }
      speak(t) { if (!this.enabled || !window.speechSynthesis) return; setAmbientAudio(); window.speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.rate = 1.1; u.pitch = 0.9; u.volume = 0.8; window.speechSynthesis.speak(u); }
      startHeartbeat() { if (this.hb) return; this.init(); this.hb = setInterval(() => { if (!this.ctx) return; const o = this.ctx.createOscillator(), g = this.ctx.createGain(); o.connect(g); g.connect(this.ctx.destination); g.gain.setValueAtTime(0.001, this.ctx.currentTime); o.start(this.ctx.currentTime); o.stop(this.ctx.currentTime + 0.01); }, 10000); }
      stopHeartbeat() { if (this.hb) { clearInterval(this.hb); this.hb = null; } }
      toggle() { this.enabled = !this.enabled; return this.enabled; }
    }
    const audio = new AudioEngine();

    // Disabled: claiming the lock-screen "Now Playing" slot made iOS pause the user's music.
    function updateMedia(title, artist) { }

    // Module-scope mirror of the active workout. Plain mutable object so it can
    // never fall out of scope between components (App writes, Train reads).
    const woRef = { current: null };

    const AppCtx = createContext(null);

    // --- Ring Timer SVG Component ---
    function RingTimer({ seconds, total, color, size = 170 }) {
      const r = (size - 6) / 2;
      const circ = 2 * Math.PI * r;
      const progress = total > 0 ? Math.max(0, Math.min(1, seconds / total)) : 0;
      const offset = circ * (1 - progress);
      return h("svg", { width: size, height: size, viewBox: `0 0 ${size} ${size}`, style: { transform: "rotate(-90deg)", "--glow-color": `${color}40`, animation: "ringGlow 3s ease infinite" } },
        h("circle", { cx: size/2, cy: size/2, r, fill: "none", stroke: C.border, strokeWidth: 2.5 }),
        h("circle", { cx: size/2, cy: size/2, r, fill: "none", stroke: color, strokeWidth: 2.5, strokeLinecap: "round", strokeDasharray: circ, strokeDashoffset: offset, style: { filter: `drop-shadow(0 0 6px ${color}50)`, transition: "stroke-dashoffset 0.15s linear" } }),
      );
    }

    // ============================================================
    // MAIN APP
    // ============================================================
    function App() {
      const [db, setDb] = useState(() => loadDB());
      const [screen, setScreen] = useState("home");
      const [wo, setWo] = useState(null);
      useEffect(() => { woRef.current = wo; }, [wo]);
      const [notif, setNotif] = useState(null);
      const [phase, setPhase] = useState(PHASES.PREP);
      const [timer, setTimer] = useState(DEFAULT_TIMERS.prep);
      const [paused, setPaused] = useState(false);
      const [clock, setClock] = useState(0);
      const [showRestore, setShowRestore] = useState(false);
      const crashSnap = useRef(null);

      // Check for crashed workout on mount
      useEffect(() => {
        const snap = loadActiveWorkout();
        if (snap && snap.wo) { crashSnap.current = snap; setShowRestore(true); }
      }, []);

      function restoreWorkout() {
        const snap = crashSnap.current;
        if (!snap) return;
        const restoredWo = snap.wo;
        const totalElapsed = snap.clock + Math.floor((Date.now() - snap.savedAt) / 1000);
        restoredWo.startTime = Date.now() - totalElapsed * 1000;
        setWo(restoredWo); setPhase(snap.phase === PHASES.DONE ? PHASES.DONE : PHASES.WORK);
        setTimer(0); setClock(totalElapsed); setPaused(true); setScreen("train");
        setShowRestore(false); crashSnap.current = null;
        notify("Workout restored! 💪 Paused — tap play when ready.", "success");
      }
      function dismissRestore() { clearActiveWorkout(); setShowRestore(false); crashSnap.current = null; }

      const persist = useCallback((updater) => {
        setDb(prev => {
          let next = typeof updater === "function" ? updater(prev) : updater;
          // Keep pbsByGym in sync with the active gym's pbs map
          if (next.activeGym) {
            next = { ...next, pbsByGym: { ...(next.pbsByGym || {}), [next.activeGym]: next.pbs || {} } };
          }
          const saved = saveDB(next);
          if (!saved) { setTimeout(() => setNotif({ msg: "⚠️ Save failed! Your data may not persist.", type: "error", id: Date.now() }), 100); }
          return next;
        });
      }, []);
      const notify = useCallback((msg, type = "info") => { setNotif({ msg, type, id: Date.now() }); setTimeout(() => setNotif(null), 2500); }, []);

      // Switch active gym: stash current pbs into pbsByGym, load the new gym's pbs
      const switchGym = useCallback((gym) => {
        persist(prev => {
          const pbg = { ...(prev.pbsByGym || {}), [prev.activeGym || "Saint Haven"]: prev.pbs || {} };
          return { ...prev, pbsByGym: pbg, activeGym: gym, pbs: pbg[gym] || {} };
        });
      }, [persist]);

      const ctx = { db, persist, notify, screen, setScreen, wo, setWo, phase, setPhase, timer, setTimer, paused, setPaused, clock, setClock, switchGym };

      return h(AppCtx.Provider, { value: ctx },
        notif && h(Toast, notif),
        // Crash restore modal
        showRestore && h("div", { style: { position: "fixed", inset: 0, background: "rgba(0,0,0,0.85)", zIndex: 300, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 } },
          h("div", { className: "slide-up", style: { background: C.surface, borderRadius: 20, padding: 28, width: "100%", maxWidth: 360, border: `1px solid ${C.green}40`, textAlign: "center" } },
            h("div", { style: { fontSize: 48, marginBottom: 12 } }, "🔄"),
            h("h3", { style: { fontSize: 18, fontWeight: 700, marginBottom: 8 } }, "Workout Recovery"),
            h("p", { style: { color: C.textDim, fontSize: 13, marginBottom: 6, lineHeight: 1.5 } }, "Found an interrupted workout session."),
            crashSnap.current && h("div", { style: { background: C.bg, borderRadius: 10, padding: 12, marginBottom: 16, border: `1px solid ${C.border}` } },
              h("div", { style: { fontSize: 14, fontWeight: 600, marginBottom: 4 } }, `${crashSnap.current.wo.exercises?.length || 0} exercises`),
              h("div", { style: { fontSize: 12, color: C.textDim } }, `${fmtDur(crashSnap.current.clock)} elapsed • ${crashSnap.current.wo.exercises?.reduce((s, e) => s + e.sets.filter(x => x.completed).length, 0) || 0} sets done`),
            ),
            h("div", { style: { display: "flex", gap: 8 } },
              h("button", { onClick: restoreWorkout, style: { flex: 1, background: C.green, color: C.bg, border: "none", borderRadius: 12, padding: 14, fontWeight: 700, cursor: "pointer", fontSize: 14 } }, "Restore"),
              h("button", { onClick: dismissRestore, style: { flex: 1, background: C.bg, color: C.textDim, border: `1px solid ${C.border}`, borderRadius: 12, padding: 14, fontWeight: 600, cursor: "pointer", fontSize: 14 } }, "Discard"),
            ),
          ),
        ),
        screen === "home" && h(Home),
        screen === "train" && h(Train),
        screen === "blueprints" && h(Blueprints),
        screen === "build" && h(Build),
        screen === "history" && h(History),
        screen === "analytics" && h(Analytics),
        screen === "settings" && h(Settings),
        screen === "export" && h(Export),
        h(NavBar),
      );
    }

    // --- Toast ---
    function Toast({ msg, type }) {
      const colors = { info: C.cyan, success: C.green, error: C.red, warn: C.amber };
      return h("div", { className: "slide-up", style: {
        position: "fixed", top: 16, left: "50%", transform: "translateX(-50%)", background: C.surface,
        border: `1px solid ${colors[type] || C.cyan}`, color: colors[type] || C.cyan,
        padding: "10px 20px", borderRadius: 12, fontSize: 13, fontWeight: 500, zIndex: 9999,
        maxWidth: "90%", textAlign: "center", boxShadow: `0 4px 20px ${(colors[type] || C.cyan)}30`,
      }}, msg);
    }

    // --- NavBar ---
    function NavBar() {

      const monthStart = thisMonthStart();

      const totalVol = filteredHistory.reduce((s, x) => s + (x.exercises || []).reduce((es, ex) => es + (ex.sets || []).reduce((ss, st) => ss + (st.weight || 0) * (st.reps || 0), 0), 0), 0);

      // Sets per muscle group for selected period
      const muscleSets = useMemo(() => {
        const counts = {};
        filteredHistory.forEach(session => {
          (session.exercises || []).forEach(ex => {
            const muscle = ex.muscle || detectMuscle(ex.name);
            if (muscle && muscle !== "cardio") {

        return Object.entries(counts).sort((a, b) => b[1] - a[1]);
      }, [filteredHistory]);

      // Total working sets — every set that exists, regardless of the completed flag.
      // Sets skipped past mid-workout keep completed:false but were still performed.
      const totalWorkingSets = useMemo(() => {
        return filteredHistory.reduce((total, session) =>
          total + (session.exercises || []).reduce((exTotal, ex) =>
            exTotal + (ex.sets || []).length, 0), 0);
      }, [filteredHistory]);

      // PBs achieved this week
      const weekPBs = useMemo(() => {
        const activeGym = db.activeGym || "Saint Haven";
        const weekSessions = db.history.filter(x => new Date(x.date) >= mondayStart && (x.gym || "Saint Haven") === activeGym);
        const results = [];
        const allPBs = db.pbs || {};
        weekSessions.forEach(session => {
          (session.exercises || []).forEach(ex => {
            const k = pbKey(ex.name);
            const pb = allPBs[k];
            if (!pb) return;
            const sessionMax = Math.max(0, ...(ex.sets || []).map(s => s.weight || 0));
            if (sessionMax >= pb.maxWeight && sessionMax > 0) {
              if (!results.find(r => r.key === k)) results.push({ key: k, name: pb._displayName || ex.name, weight: pb.maxWeight, reps: (pb.repsAtMax != null ? pb.repsAtMax : pb.maxReps) });

        return results;
      }, [db.history, db.pbs, db.activeGym]);

      function makeExercises(names) {

        }));

      function startBP(bp) { setWo({ id: genId(), exercises: makeExercises(bp.exercises.map(e => e.name)), currentExIdx: 0, currentSetIdx: 0, startTime: Date.now() }); setScreen("train"); }
      function startQuick() { if (!quickText.trim()) return; const lines = quickText.split("\n").map(l => l.trim()).filter(Boolean); setWo({ id: genId(), exercises: makeExercises(lines), currentExIdx: 0, currentSetIdx: 0, startTime: Date.now() }); setScreen("train"); notify(`Loaded ${lines.length} exercises`, "success"); }
      function startEmpty() { setWo({ id: genId(), exercises: [], currentExIdx: 0, currentSetIdx: 0, startTime: Date.now() }); setScreen("train"); }

      return h("div", { className: "fade-in", style: { padding: "20px 16px", maxWidth: 500, margin: "0 auto", paddingBottom: 90 } },
        // Header
        h("div", { style: { textAlign: "center", padding: "30px 0 20px" } },
          h("h1", { style: { fontSize: 36, fontWeight: 900, letterSpacing: -1, background: `linear-gradient(135deg, ${C.cyan}, ${C.green})`, WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent" } }, "REPVAULT"),
          h("p", { style: { color: C.textDim, fontSize: 13, marginTop: 4, fontWeight: 300 } }, "Your Training. Locked In."),
        ),
        // Gym selector — PBs are tracked per gym
        h("div", { style: { display: "flex", gap: 6, marginBottom: 12, justifyContent: "center" } },
          (db.gyms || ["Saint Haven", "Mt Martha", "Other"]).map(g => {
            const active = (db.activeGym || "Saint Haven") === g;
            return h("button", { key: g, onClick: () => { if (!active) { switchGym(g); notify(`Gym: ${g} — PBs switched`, "success"); } }, style: {

              background: active ? `${C.cyan}18` : C.surface, color: active ? C.cyan : C.textDim,
              border: `1px solid ${active ? C.cyan + "50" : C.border}`,
            }, }, `📍 ${g}`);
          }),
        ),
        // Week / Month toggle
        h("div", { style: { display: "flex", gap: 4, marginBottom: 12, background: C.surface, borderRadius: 10, padding: 3 } },
          h("button", { onClick: () => setViewMode("week"), style: { flex: 1, padding: "8px 0", borderRadius: 8, border: "none", fontSize: 12, fontWeight: 600, cursor: "pointer", background: viewMode === "week" ? C.cyan : "transparent", color: viewMode === "week" ? C.bg : C.textDim } }, "This Week"),
          h("button", { onClick: () => setViewMode("month"), style: { flex: 1, padding: "8px 0", borderRadius: 8, border: "none", fontSize: 12, fontWeight: 600, cursor: "pointer", background: viewMode === "month" ? C.cyan : "transparent", color: viewMode === "month" ? C.bg : C.textDim } }, "This Month"),
        ),
        // Summary
        h("div", { style: { background: C.surface, borderRadius: 16, padding: 20, border: `1px solid ${C.border}`, marginBottom: 16 } },
          h("div", { style: { fontSize: 11, color: C.textDim, textTransform: "uppercase", letterSpacing: 1, marginBottom: 12 } }, viewMode === "week" ? "This Week (Mon–Sun)" : "Month to Date"),
          h("div", { style: { display: "flex", gap: 16 } },
            h("div", { style: { flex: 1, textAlign: "center" } }, h("div", { style: { fontSize: 28, fontWeight: 700, color: C.cyan, fontFamily: "'JetBrains Mono'" } }, filteredHistory.length), h("div", { style: { fontSize: 11, color: C.textDim } }, "Sessions")),
            h("div", { style: { width: 1, background: C.border } }),
            h("div", { style: { flex: 1, textAlign: "center" } }, h("div", { style: { fontSize: 28, fontWeight: 700, color: C.green, fontFamily: "'JetBrains Mono'" } }, totalWorkingSets), h("div", { style: { fontSize: 11, color: C.textDim } }, "Working Sets")),
            h("div", { style: { width: 1, background: C.border } }),
            h("div", { style: { flex: 1, textAlign: "center" } }, h("div", { style: { fontSize: 28, fontWeight: 700, color: C.amber, fontFamily: "'JetBrains Mono'" } }, weekPBs.length), h("div", { style: { fontSize: 11, color: C.textDim } }, "PBs")),
          ),
        ),
        // Muscle group breakdown
        muscleSets.length > 0 && h("div", { style: { background: C.surface, borderRadius: 16, padding: 20, border: `1px solid ${C.border}`, marginBottom: 16 } },
          h("div", { style: { fontSize: 11, color: C.textDim, textTransform: "uppercase", letterSpacing: 1, marginBottom: 12 } }, `${viewMode === "week" ? "Weekly" : "Monthly"} Sets by Muscle`),
          h("div", { style: { display: "flex", flexWrap: "wrap", gap: 6 } },
            muscleSets.map(([muscle, count]) => {
              const maxSets = muscleSets[0]?.[1] || 1;
              const intensity = Math.max(0.3, count / maxSets);
              const muscleColors = { chest: C.cyan, back: C.green, shoulders: C.amber, glutes: C.purple, quads: C.cyan, hamstrings: C.green, calves: C.amber, biceps: C.cyan, triceps: C.green, core: C.amber, plyometric: C.pink || "#ff6b9d" };
              const mc = muscleColors[muscle] || C.cyan;
              return h("div", { key: muscle, style: { display: "flex", alignItems: "center", gap: 8, padding: "8px 12px", background: `${mc}${Math.round(intensity * 20).toString(16).padStart(2, "0")}`, border: `1px solid ${mc}30`, borderRadius: 10, minWidth: "calc(50% - 3px)" } },
                h("div", { style: { flex: 1 } },
                  h("div", { style: { fontSize: 12, fontWeight: 600, color: C.text, textTransform: "capitalize" } }, muscle),
                ),
                h("div", { style: { fontSize: 20, fontWeight: 700, color: mc, fontFamily: "'JetBrains Mono'" } }, count),
              );
            }),
          ),
        ),
        // This week's PBs
        weekPBs.length > 0 && h("div", { style: { background: `linear-gradient(135deg, ${C.gold}08, ${C.gold}03)`, borderRadius: 16, padding: 16, border: `1px solid ${C.gold}25`, marginBottom: 16 } },
          h("div", { style: { fontSize: 11, color: C.gold, textTransform: "uppercase", letterSpacing: 1, marginBottom: 10, fontWeight: 700 } }, `🏆 This Week's PBs (${weekPBs.length})`),
          weekPBs.map(pb => h("div", { key: pb.key, style: { display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 10px", background: `${C.gold}08`, borderRadius: 8, marginBottom: 3, border: `1px solid ${C.gold}12` } },
            h("span", { style: { fontSize: 12, fontWeight: 600, textTransform: "capitalize", flex: 1 } }, pb.name),
            h("div", { style: { display: "flex", gap: 8, alignItems: "center" } },
              h("span", { style: { fontSize: 13, color: C.gold, fontFamily: "'JetBrains Mono'", fontWeight: 700 } }, `${pb.weight}kg`),
              h("span", { style: { fontSize: 11, color: C.green, fontFamily: "'JetBrains Mono'" } }, `${pb.reps}r`),
            ),
          )),
        ),
        // Today's blueprint
        todayBP && h("button", { onClick: () => startBP(todayBP), style: { width: "100%", background: `linear-gradient(135deg, ${C.cyan}15, ${C.green}15)`, border: `1px solid ${C.cyan}40`, borderRadius: 16, padding: 20, color: C.text, cursor: "pointer", textAlign: "left", marginBottom: 16 } },
          h("div", { style: { fontSize: 11, color: C.cyan, textTransform: "uppercase", letterSpacing: 1, marginBottom: 6 } }, `${todayName}'s Plan`),
          h("div", { style: { fontSize: 18, fontWeight: 700, marginBottom: 8 } }, todayBP.name || `${todayName} Session`),
          h("div", { style: { fontSize: 12, color: C.textDim } }, `${todayBP.exercises?.length || 0} exercises • Tap to start`),
        ),
        // Quick start buttons
        h("div", { style: { display: "flex", gap: 10, marginBottom: 16 } },
          h("button", { onClick: () => setShowQuick(!showQuick), style: { flex: 1, background: C.surface, border: `1px solid ${C.border}`, borderRadius: 12, padding: "16px 12px", color: C.text, cursor: "pointer", fontSize: 14, fontWeight: 600 } }, "📝 Bulk Import"),
          h("button", { onClick: startEmpty, style: { flex: 1, background: C.surface, border: `1px solid ${C.border}`, borderRadius: 12, padding: "16px 12px", color: C.text, cursor: "pointer", fontSize: 14, fontWeight: 600 } }, "➕ Empty Session"),
        ),
        // Bulk import
        showQuick && h("div", { className: "slide-up", style: { background: C.surface, borderRadius: 16, padding: 16, border: `1px solid ${C.border}`, marginBottom: 16 } },
          h("div", { style: { fontSize: 12, color: C.textDim, marginBottom: 8 } }, "One exercise per line:"),
          h("textarea", { value: quickText, onChange: e => setQuickText(e.target.value), placeholder: "Bench Press\nLat Pulldown\nSquat\nBicep Curl", rows: 6, style: { width: "100%", background: C.bg, border: `1px solid ${C.border}`, borderRadius: 8, padding: 12, color: C.text, fontSize: 14, resize: "none", outline: "none" } }),
          h("button", { onClick: startQuick, style: { width: "100%", marginTop: 10, background: C.cyan, color: C.bg, border: "none", borderRadius: 10, padding: 14, fontSize: 15, fontWeight: 700, cursor: "pointer" } }, "Load & Start"),
        ),
        // Export
        h("button", { onClick: () => setScreen("export"), style: { width: "100%", background: C.surface, border: `1px solid ${C.border}`, borderRadius: 12, padding: 14, color: C.textDim, cursor: "pointer", fontSize: 13, fontWeight: 500, marginTop: 8 } }, "📤 Export AI-Ready Data"),
      );

    // ============================================================
    // TRAINING SCREEN
    // ============================================================
    function Train() {
      const { db, persist, notify, setScreen, wo, setWo, phase, setPhase, timer, setTimer, paused, setPaused, clock, setClock , switchGym } = useContext(AppCtx);
      const [showAdd, setShowAdd] = useState(false);
      const [addText, setAddText] = useState("");
      const [showQuit, setShowQuit] = useState(false);
      const [editingQueueIdx, setEditingQueueIdx] = useState(null);
      const [editingQueueName, setEditingQueueName] = useState("");
      const [editingCurrentName, setEditingCurrentName] = useState(null); // null = not editing, string = editing
      const [pbOverlay, setPbOverlay] = useState(null); // { name, weight, reps, prevWeight, prevReps }
      const [sessionPBs, setSessionPBs] = useState([]); // PBs achieved this workout
      const [rating, setRating] = useState(null); // 1-5 performance self-rating
      const [note, setNote] = useState(""); // free-text comment

      // Exercise library + live near-duplicate suggestions for the Add box
      const library = useMemo(() => buildExerciseLibrary(db), [db.history, db.blueprints]);
      // Same near-duplicate guard, but for the mid-workout rename field.
      // Excludes the exercise's own current name so it doesn't suggest itself.
      const renameSuggestions = useMemo(() => {
        if (editingCurrentName === null) return [];
        const cur = wo?.exercises?.[wo.currentExIdx]?.name;
        return findSimilar(editingCurrentName, library, 6).filter(s => s.name !== cur).slice(0, 3);
      }, [editingCurrentName, library, wo?.currentExIdx]);

      const addSuggestions = useMemo(() => {
        const lines = (addText || "").split("\n");
        const last = (lines[lines.length - 1] || "").trim();
        return findSimilar(last, library);
      }, [addText, library]);

      const timerRef = useRef(null);
      const clockRef = useRef(null);
      const backRef = useRef(0);
      const timers = db.settings?.timers || DEFAULT_TIMERS;
      const curEx = wo?.exercises[wo.currentExIdx];
      const totalSets = wo ? wo.exercises.reduce((s, e) => s + e.sets.length, 0) : 0;
      const doneSets = wo ? wo.exercises.reduce((s, e) => s + e.sets.filter(x => x.completed).length, 0) : 0;
      const remainingSets = totalSets - doneSets;

      // Estimated time remaining
      const estRemaining = useMemo(() => {
        if (!wo || phase === PHASES.DONE) return 0;
        const avgSetCycle = timers.work + timers.restSet;
        const remainingExercises = wo.exercises.length - wo.currentExIdx - 1;
        return Math.max(0, remainingSets * avgSetCycle + remainingExercises * (timers.restEx - timers.restSet));
      }, [wo?.currentExIdx, wo?.currentSetIdx, remainingSets, timers, phase]);

      // Determine which exercise to show stats for: current, or next during REST_EX
      const statsEx = (phase === PHASES.REST_EX && wo) ? wo.exercises[wo.currentExIdx + 1] : curEx;

      // PB data
      const curPB = statsEx ? db.pbs?.[pbKey(statsEx.name)] : null;

      // Find the session where the PB weight was set
      const pbSession = useMemo(() => {
        if (!statsEx || !curPB) return null;
        const nm = pbKey(statsEx.name);
        for (let i = db.history.length - 1; i >= 0; i--) {
          const ex = db.history[i].exercises?.find(e => pbKey(e.name) === nm);
          if (ex && ex.sets?.some(s => s.weight === curPB.maxWeight)) return { date: db.history[i].date };
        }
        return null;
      }, [statsEx?.name, curPB, db.history]);

      // Last performance — most recent session with this exercise
      const lastPerf = useMemo(() => {
        if (!statsEx) return null;
        const nm = pbKey(statsEx.name);
        const activeGym = db.activeGym || "Saint Haven";
        const findIn = (matchGym) => {
          for (let i = db.history.length - 1; i >= 0; i--) {
            const sGym = db.history[i].gym || "Saint Haven"; // legacy sessions = default gym
            if (matchGym && sGym !== activeGym) continue;
            const ex = db.history[i].exercises?.find(e => pbKey(e.name) === nm);
            if (ex) {
              const sets = ex.sets || [];
              const maxW = Math.max(0, ...sets.map(s => s.weight || 0));
              return {
                date: db.history[i].date,
                sets,
                maxWeight: maxW,
                vol: sets.reduce((s, st) => s + (st.weight || 0) * (st.reps || 0), 0),
                gym: sGym,
              };
            }
          }
          return null;
        };
        // Prefer same-gym history; fall back to any gym (labelled with its gym code)
        return findIn(true) || findIn(false);
      }, [statsEx?.name, db.history, db.activeGym]);;

      // Auto-populate weights (not reps) from last session when exercise changes
      const prevExIdxRef = useRef(null);
      useEffect(() => {
        if (!wo || !curEx || curEx.isCardio) return;
        if (prevExIdxRef.current === wo.currentExIdx) return;
        prevExIdxRef.current = wo.currentExIdx;
        if (lastPerf && lastPerf.sets.length > 0) {
          const allEmpty = curEx.sets.every(s => !s.weight || s.weight === 0);
          if (allEmpty) {
            setWo(prev => {
              const next = deepClone(prev);
              const ex = next.exercises[next.currentExIdx];
              ex.sets.forEach((s, i) => {
                const historySet = lastPerf.sets[i] || lastPerf.sets[lastPerf.sets.length - 1];
                if (historySet) {
                  s.weight = historySet.weight || 0;
                  // Don't pre-populate reps — user enters fresh each set
                }
              });
              return next;
            });
          }
        }
      }, [wo?.currentExIdx, lastPerf]);

      function updateSet(ei, si, field, val) {
        setWo(prev => {
          const next = deepClone(prev);
          next.exercises[ei].sets[si][field] = val;
          return next;
        });
      }

      function spreadWeight(ei) {
        setWo(prev => {
          const next = deepClone(prev);
          const w = next.exercises[ei].sets[0]?.weight;
          if (!w) return prev;
          for (let i = 1; i < next.exercises[ei].sets.length; i++) {
            if (!next.exercises[ei].sets[i].weight) next.exercises[ei].sets[i].weight = w;
          }
          return next;
        });
      }

      function copyWeightDown(ei, fromSetIdx) {
        setWo(prev => {
          const next = deepClone(prev);
          const w = next.exercises[ei].sets[fromSetIdx]?.weight;
          if (!w) return prev;
          for (let i = fromSetIdx + 1; i < next.exercises[ei].sets.length; i++) {
            next.exercises[ei].sets[i].weight = w;
          }
          return next;
        });
        notify("Weight copied to remaining sets", "success");
      }

      useEffect(() => { audio.init(); audio.startHeartbeat(); return () => audio.stopHeartbeat(); }, []);

      // --- CRASH RECOVERY: auto-save workout state every 3s + on state change ---
      const saveIntervalRef = useRef(null);
      // Hold the timer while the gym question is open
      useEffect(() => { if (wo && !wo.gymChosen) setPaused(true); }, [wo?.gymChosen]);
      useEffect(() => {
        if (!wo) { clearActiveWorkout(); return; }
        saveActiveWorkout(wo, phase, Math.floor((Date.now() - wo.startTime) / 1000));
        saveIntervalRef.current = setInterval(() => {
          const latest = woRef?.current || wo;
          saveActiveWorkout(latest, phase, Math.floor((Date.now() - latest.startTime) / 1000));
        }, 3000);
        return () => clearInterval(saveIntervalRef.current);
      }, [wo, phase]);

      // Wall-clock based timer — stores the absolute end time so we can catch up after lock/resume
      const phaseEndTime = useRef(Date.now() + (db.settings?.timers?.prep || DEFAULT_TIMERS.prep) * 1000);

      // Set the end time whenever phase changes
      function setPhaseTimer(seconds) {
        phaseEndTime.current = Date.now() + seconds * 1000;
        setTimer(seconds);
      }

      // Timer tick — calculates remaining from wall clock
      useEffect(() => {
        if (paused || phase === PHASES.DONE || !wo) return;
        timerRef.current = setInterval(() => {
          const remaining = (phaseEndTime.current - Date.now()) / 1000;
          if (remaining <= 3.1 && remaining > 2.9) audio.countdownPip();
          if (remaining <= 2.1 && remaining > 1.9) audio.countdownPip();
          if (remaining <= 1.1 && remaining > 0.9) audio.countdownPip();
          if (remaining <= 0) { audio.phasePip(); advancePhase(); return; }
          setTimer(remaining);
        }, 100);
        return () => clearInterval(timerRef.current);
      }, [phase, paused, wo?.currentExIdx, wo?.currentSetIdx, wo]);

      // Resume catch-up: when app becomes visible again, check if timer expired while locked
      useEffect(() => {
        function handleResume() {
          if (document.visibilityState !== "visible" || paused || phase === PHASES.DONE || !wo) return;
          const remaining = (phaseEndTime.current - Date.now()) / 1000;
          if (remaining <= 0) {
            // Phase expired while locked — advance
            audio.phasePip();
            advancePhase();
          } else {
            setTimer(remaining);
          }
        }
        document.addEventListener("visibilitychange", handleResume);
        window.addEventListener("focus", handleResume);
        return () => { document.removeEventListener("visibilitychange", handleResume); window.removeEventListener("focus", handleResume); };
      }, [phase, paused, wo?.currentExIdx, wo?.currentSetIdx, wo]);

      // Pause/resume: adjust end time when pausing/unpausing
      const pausedAtRef = useRef(null);
      const remainingAtPause = useRef(0);
      useEffect(() => {
        if (paused) {
          // Store how much time was left
          pausedAtRef.current = Date.now();
          remainingAtPause.current = Math.max(0, (phaseEndTime.current - Date.now()) / 1000);
        } else if (pausedAtRef.current !== null) {
          // Restore end time based on remaining
          phaseEndTime.current = Date.now() + remainingAtPause.current * 1000;
          pausedAtRef.current = null;
        }
      }, [paused]);

      // Session clock
      useEffect(() => {
        if (!wo) return;
        clockRef.current = setInterval(() => setClock(Math.floor((Date.now() - wo.startTime) / 1000)), 1000);
        return () => clearInterval(clockRef.current);
      }, [wo?.startTime]);

    // ============================================================
    // ANALYTICS
    // ============================================================
    function Analytics() {
      const { db, persist, notify } = useContext(AppCtx);
      const [editingPB, setEditingPB] = useState(null);
      const [mergePlan, setMergePlan] = useState(null); // null = modal closed
      const [pbWeight, setPbWeight] = useState(0);
      const [pbReps, setPbReps] = useState(0);

      // Weekly sessions data for chart — using Monday-AEST boundaries
      const weeklyData = useMemo(() => {
        const weeks = {};
        db.history.forEach(x => {
          const mon = getMonday(new Date(x.date));
          const k = mon.toISOString().split("T")[0];
          if (!weeks[k]) weeks[k] = { sessions: 0, sets: 0 };
          weeks[k].sessions++;
          (x.exercises || []).forEach(ex => { weeks[k].sets += (ex.sets || []).length; });
        });
        return Object.entries(weeks).sort((a, b) => a[0].localeCompare(b[0])).slice(-8);
      }, [db.history]);

      const curSets = weeklyData.length > 0 ? weeklyData[weeklyData.length - 1][1].sets : 0;
      const lastSets = weeklyData.length > 1 ? weeklyData[weeklyData.length - 2][1].sets : 0;
      const change = lastSets > 0 ? ((curSets - lastSets) / lastSets * 100).toFixed(0) : 0;
      const curSessions = weeklyData.length > 0 ? weeklyData[weeklyData.length - 1][1].sessions : 0;

      const pbs = Object.entries(db.pbs || {}).sort((a, b) => b[1].maxWeight - a[1].maxWeight);

      // PBs set this week — scan history for sessions this week, find max per exercise
      const weekPBs = useMemo(() => {
        const mondayStart = thisMonday();
        const thisWeekSessions = db.history.filter(x => new Date(x.date) >= mondayStart);
        const results = [];
        const allPBs = db.pbs || {};
        thisWeekSessions.forEach(session => {
          (session.exercises || []).forEach(ex => {
            const k = pbKey(ex.name);
            const pb = allPBs[k];
            if (!pb) return;
            const sessionMax = Math.max(0, ...(ex.sets || []).map(s => s.weight || 0));
            if (sessionMax >= pb.maxWeight && sessionMax > 0) {
              if (!results.find(r => r.key === k)) results.push({ key: k, name: pb._displayName || ex.name, weight: pb.maxWeight, reps: (pb.repsAtMax != null ? pb.repsAtMax : pb.maxReps) });
            }
          });
        });
        return results;
      }, [db.history, db.pbs]);

      function runDedup() {
        const p = planNameMerge(db).map(g => ({ ...g, variants: g.variants.map(v => ({ ...v, include: v.safe })) }));
        if (p.length === 0) { notify("No duplicate names found", "info"); return; }
        setMergePlan(p);
      }

      function toggleVariant(gi, vi) {
        setMergePlan(prev => prev.map((g, i) => i !== gi ? g : ({
          ...g, variants: g.variants.map((v, j) => j !== vi ? v : ({ ...v, include: !v.include })),
        })));
      }
      function setAllVariants(on) {
        setMergePlan(prev => prev.map(g => ({ ...g, variants: g.variants.map(v => ({ ...v, include: on })) })));
      }

      function confirmMerge() {
        const chosen = (mergePlan || []).filter(g => g.variants.some(v => v.include));
        const count = chosen.reduce((t, g) => t + g.variants.filter(v => v.include).length, 0);
        if (count === 0) { notify("Nothing selected", "warn"); return; }
        const { db: merged, renamed } = applyNameMerge(db, chosen);
        persist(() => merged);
        setMergePlan(null);
        notify(`Merged ${count} name(s) across ${renamed} entries`, "success");
      }

      function startEditPB(name, pb) { setEditingPB(name); setPbWeight(pb.maxWeight); setPbReps((pb.repsAtMax != null ? pb.repsAtMax : pb.maxReps)); }
      function savePB() {
        persist(prev => ({ ...prev, pbs: { ...prev.pbs, [editingPB]: { ...prev.pbs[editingPB], maxWeight: pbWeight, maxReps: pbReps, repsAtMax: pbReps } } }));
        setEditingPB(null); notify("PB updated", "success");
      }
      function deletePB(name) {
        persist(prev => { const pbs = { ...prev.pbs }; delete pbs[name]; return { ...prev, pbs }; });
        notify(`Deleted PB: ${name}`, "info");
      }

      return h("div", { className: "fade-in", style: { padding: "20px 16px", maxWidth: 500, margin: "0 auto", paddingBottom: 90 } },
        h("h2", { style: { fontSize: 22, fontWeight: 800, marginBottom: 16 } }, "Analytics"),
        // Merge preview — lists exactly what will be renamed, tick per variant
        mergePlan && h("div", { style: { position: "fixed", inset: 0, background: "rgba(0,0,0,0.85)", zIndex: 300, display: "flex", alignItems: "flex-end", justifyContent: "center" }, onClick: e => { if (e.target === e.currentTarget) setMergePlan(null); } },
          h("div", { className: "slide-up", style: { background: C.surface, borderRadius: "20px 20px 0 0", width: "100%", maxWidth: 500, maxHeight: "88vh", display: "flex", flexDirection: "column", border: `1px solid ${C.border}` } },
            h("div", { style: { padding: "18px 16px 10px", borderBottom: `1px solid ${C.border}` } },
              h("div", { style: { fontSize: 17, fontWeight: 800 } }, "Merge duplicate names"),
              h("div", { style: { fontSize: 11, color: C.textDim, marginTop: 4, lineHeight: 1.5 } }, "Renames matching exercises across your whole history, blueprints and PBs. Ticked rows are identical apart from case, spacing or word order. Untick anything you want kept separate."),
              h("div", { style: { display: "flex", gap: 8, marginTop: 10 } },
                h("button", { onClick: () => setAllVariants(true), style: { flex: 1, background: C.bg, border: `1px solid ${C.border}`, borderRadius: 8, padding: 8, color: C.textDim, fontSize: 11, cursor: "pointer" } }, "Select all"),
                h("button", { onClick: () => setAllVariants(false), style: { flex: 1, background: C.bg, border: `1px solid ${C.border}`, borderRadius: 8, padding: 8, color: C.textDim, fontSize: 11, cursor: "pointer" } }, "Select none"),
              ),
            ),
            h("div", { style: { overflowY: "auto", padding: "10px 16px", flex: 1 } },
              mergePlan.map((g, gi) => h("div", { key: gi, style: { marginBottom: 12, background: C.bg, borderRadius: 10, padding: 10, border: `1px solid ${g.safe ? C.border : C.amber + "40"}` } },
                h("div", { style: { display: "flex", alignItems: "center", gap: 6, marginBottom: 6 } },
                  h("span", { style: { fontSize: 9, color: C.green, textTransform: "uppercase", letterSpacing: 1, fontWeight: 700, flexShrink: 0 } }, "Keep"),
                  h("span", { style: { fontSize: 13, fontWeight: 700, color: C.text } }, g.canonical),
                  !g.safe && h("span", { style: { fontSize: 9, color: C.amber, marginLeft: "auto", flexShrink: 0 } }, "⚠️ check"),
                ),
                g.variants.map((v, vi) => h("button", {
                  key: vi,
                  onClick: () => toggleVariant(gi, vi),
                  style: { width: "100%", textAlign: "left", display: "flex", alignItems: "center", gap: 8, background: "none", border: "none", padding: "5px 0", cursor: "pointer" },
                },
                  h("span", { style: { width: 17, height: 17, borderRadius: 4, flexShrink: 0, border: `1.5px solid ${v.include ? C.green : C.border}`, background: v.include ? C.green : "none", color: C.bg, fontSize: 11, fontWeight: 900, display: "flex", alignItems: "center", justifyContent: "center" } }, v.include ? "✓" : ""),
                  h("span", { style: { flex: 1, fontSize: 12, color: v.include ? C.textDim : C.border, textDecoration: v.include ? "line-through" : "none" } }, v.name),
                  !v.safe && h("span", { style: { fontSize: 9, color: C.amber, flexShrink: 0 } }, "differs"),
                  v.count > 0 && h("span", { style: { fontSize: 10, color: C.textDim, fontFamily: "'JetBrains Mono'", flexShrink: 0 } }, `${v.count}\u00d7`),
                )),
              )),
            ),
            h("div", { style: { padding: 16, borderTop: `1px solid ${C.border}`, display: "flex", gap: 8 } },
              h("button", { onClick: () => setMergePlan(null), style: { flex: 1, background: C.bg, border: `1px solid ${C.border}`, borderRadius: 10, padding: 13, color: C.textDim, fontWeight: 600, cursor: "pointer", fontSize: 13 } }, "Cancel"),
              h("button", { onClick: confirmMerge, style: { flex: 2, background: C.green, color: C.bg, border: "none", borderRadius: 10, padding: 13, fontWeight: 700, cursor: "pointer", fontSize: 13 } }, `Merge ${mergePlan.reduce((t, g) => t + g.variants.filter(v => v.include).length, 0)} name(s)`),
            ),
          ),
        ),
        // Weekly summary
        h("div", { style: { background: C.surface, borderRadius: 16, padding: 20, border: `1px solid ${C.border}`, marginBottom: 12 } },
          h("div", { style: { fontSize: 11, color: C.textDim, textTransform: "uppercase", letterSpacing: 1, marginBottom: 12 } }, "This Week"),
          h("div", { style: { display: "flex", gap: 16, alignItems: "flex-end" } },
            h("div", { style: { flex: 1 } }, h("div", { style: { fontSize: 11, color: C.textDim, marginBottom: 4 } }, "Working Sets"), h("div", { style: { fontSize: 28, fontWeight: 700, color: C.cyan, fontFamily: "'JetBrains Mono'" } }, curSets)),
            h("div", { style: { flex: 1 } }, h("div", { style: { fontSize: 11, color: C.textDim, marginBottom: 4 } }, "Sessions"), h("div", { style: { fontSize: 28, fontWeight: 700, color: C.green, fontFamily: "'JetBrains Mono'" } }, curSessions)),
            lastSets > 0 && h("div", { style: { padding: "6px 14px", borderRadius: 20, fontSize: 14, fontWeight: 700, background: change >= 0 ? C.greenDim : C.redDim, color: change >= 0 ? C.green : C.red } }, `${change >= 0 ? "↑" : "↓"} ${Math.abs(change)}%`),
          ),
        ),
        // Chart — weekly sets
        weeklyData.length > 0 && h("div", { style: { background: C.surface, borderRadius: 16, padding: 20, border: `1px solid ${C.border}`, marginBottom: 12 } },
          h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 } },
            h("div", { style: { fontSize: 11, color: C.textDim, textTransform: "uppercase", letterSpacing: 1 } }, "Weekly Sets"),
            h("div", { style: { fontSize: 11, color: C.textDim } }, `${weeklyData.length} weeks`),
          ),
          // Grid lines
          h("div", { style: { position: "relative", height: 140, marginBottom: 4 } },

            (() => {

            : h("div", { key: name, style: { display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 12px", background: C.bg, borderRadius: 8, marginBottom: 4, cursor: "pointer" }, onClick: () => startEditPB(name, pb) },
